services:
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: fta-browserless
    restart: unless-stopped
    shm_size: 1g
    environment:
      - TOKEN=devtoken
      - TIMEOUT=600000
    ports:
      - "3000:3000"

  app:
    build: .
    container_name: fta-app
    depends_on:
      - browserless
    restart: unless-stopped
    environment:
      - BROWSERLESS_URL=ws://browserless:3000/chromium/playwright?token=devtoken&timeout=600000
      - BROWSERLESS_MODE=playwright
      - PW_SLOWMO_MS=0
      - FTA_DATA_DIR=/data
      - APP_PORT=25000
      - FOREIGN_TRADE_NO_BROWSER=1
    ports:
      - "25000:25000"
    volumes:
      - ~/.foreign_trade:/data

networks:
  default:
    name: fta_net
